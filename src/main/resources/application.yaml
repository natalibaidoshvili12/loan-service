server:
  port: 8082

spring:
  application:
    name: loan-service

  datasource:
    url: jdbc:postgresql://localhost:5434/loan_db
    username: loan_user
    password: loan_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

book-service:
  url: http://localhost:8081
